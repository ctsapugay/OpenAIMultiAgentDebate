<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conway's Game of Life on a Sphere</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden; background: black; height: 100%;
    display: flex; justify-content: center; align-items: center;
    user-select: none;
  }
  canvas {
    display: block;
    background: black;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Configuration
  const SPHERE_RADIUS = 300; // radius in pixels
  const CELL_SIZE = 6; // size of each cell square on sphere surface
  const GRID_COLS = 60; // longitude divisions
  const GRID_ROWS = 30; // latitude divisions
  const FPS = 15;

  // Derived
  // We'll map the sphere surface as a grid of GRID_ROWS x GRID_COLS cells.
  // Each cell is a small square on the sphere surface.
  // We'll store the state of each cell (alive/dead) and color.

  // Game state arrays
  // 2D arrays: rows x cols
  let currentGrid = [];
  let nextGrid = [];

  // Color palette for alive cells (multicolor)
  // We'll assign a color to each alive cell based on its position or random.
  // Use HSL for smooth color variation.
  function cellColor(row, col) {
    // Hue based on longitude (col), saturation and lightness fixed
    const hue = (col / GRID_COLS) * 360;
    const lightness = 50 + 20 * Math.sin((row / GRID_ROWS) * Math.PI);
    return `hsl(${hue}, 80%, ${lightness}%)`;
  }

  // Initialize grids
  function initGrids() {
    currentGrid = new Array(GRID_ROWS);
    nextGrid = new Array(GRID_ROWS);
    for (let r = 0; r < GRID_ROWS; r++) {
      currentGrid[r] = new Array(GRID_COLS).fill(0);
      nextGrid[r] = new Array(GRID_COLS).fill(0);
    }
  }

  // Randomize initial state with some density
  function randomizeGrid(density = 0.15) {
    for (let r = 0; r < GRID_ROWS; r++) {
      for (let c = 0; c < GRID_COLS; c++) {
        currentGrid[r][c] = Math.random() < density ? 1 : 0;
      }
    }
  }

  // Conway's Game of Life rules on a toroidal grid (wrap around)
  function countNeighbors(r, c) {
    let count = 0;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        let nr = (r + dr + GRID_ROWS) % GRID_ROWS;
        let nc = (c + dc + GRID_COLS) % GRID_COLS;
        count += currentGrid[nr][nc];
      }
    }
    return count;
  }

  function stepGame() {
    for (let r = 0; r < GRID_ROWS; r++) {
      for (let c = 0; c < GRID_COLS; c++) {
        const alive = currentGrid[r][c];
        const neighbors = countNeighbors(r, c);
        if (alive) {
          // Any live cell with two or three live neighbours survives.
          nextGrid[r][c] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
        } else {
          // Any dead cell with three live neighbours becomes a live cell.
          nextGrid[r][c] = (neighbors === 3) ? 1 : 0;
        }
      }
    }
    // Swap grids
    [currentGrid, nextGrid] = [nextGrid, currentGrid];
  }

  // 3D sphere and projection math
  // We'll represent each cell by its spherical coordinates:
  // latitude: from -π/2 to π/2 (rows)
  // longitude: from 0 to 2π (cols)
  // Then convert to 3D cartesian, rotate, and project to 2D canvas.

  // Rotation state
  let rotationX = 0;
  let rotationY = 0;

  // Mouse drag for rotation
  let isDragging = false;
  let lastMouseX = 0;
  let lastMouseY = 0;
  let velocityX = 0;
  let velocityY = 0;

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Convert spherical coords to 3D cartesian
  // lat: -π/2 to π/2, lon: 0 to 2π
  function sphericalToCartesian(lat, lon, radius) {
    const x = radius * Math.cos(lat) * Math.cos(lon);
    const y = radius * Math.sin(lat);
    const z = radius * Math.cos(lat) * Math.sin(lon);
    return { x, y, z };
  }

  // Rotation matrices around X and Y axes
  function rotateX(point, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return {
      x: point.x,
      y: point.y * cos - point.z * sin,
      z: point.y * sin + point.z * cos,
    };
  }
  function rotateY(point, angle) {
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    return {
      x: point.x * cos + point.z * sin,
      y: point.y,
      z: -point.x * sin + point.z * cos,
    };
  }

  // Perspective projection
  // Camera at z = -distance, looking toward origin
  const CAMERA_DISTANCE = 800;
  function project(point) {
    const scale = CAMERA_DISTANCE / (CAMERA_DISTANCE + point.z);
    return {
      x: point.x * scale,
      y: point.y * scale,
      scale,
    };
  }

  // Draw a cell square on the sphere surface
  // We'll draw each cell as a small square centered at the projected point,
  // scaled by perspective and latitude (to simulate distortion).
  // We'll also apply a subtle shading based on the cell's normal facing the camera.

  // Calculate normal vector of cell center (same as position normalized)
  // Use normal.z to determine brightness (facing camera or not)

  // We'll draw cells from back to front for proper overlap:
  // Sort cells by their z coordinate after rotation.

  // Prepare cell data for rendering
  let cells = [];

  function prepareCells() {
    cells.length = 0;
    for (let r = 0; r < GRID_ROWS; r++) {
      // latitude from -π/2 to π/2
      const lat = ((r + 0.5) / GRID_ROWS) * Math.PI - Math.PI / 2;
      for (let c = 0; c < GRID_COLS; c++) {
        // longitude from 0 to 2π
        const lon = ((c + 0.5) / GRID_COLS) * 2 * Math.PI;
        let pos = sphericalToCartesian(lat, lon, SPHERE_RADIUS);
        pos = rotateX(pos, rotationX);
        pos = rotateY(pos, rotationY);

        const proj = project(pos);

        // Normal vector is pos normalized
        const length = Math.sqrt(pos.x * pos.x + pos.y * pos.y + pos.z * pos.z);
        const normal = { x: pos.x / length, y: pos.y / length, z: pos.z / length };

        cells.push({
          row: r,
          col: c,
          alive: currentGrid[r][c],
          x3d: pos.x,
          y3d: pos.y,
          z3d: pos.z,
          x2d: proj.x,
          y2d: proj.y,
          scale: proj.scale,
          normal,
        });
      }
    }
    // Sort by z3d ascending (back to front)
    cells.sort((a, b) => a.z3d - b.z3d);
  }

  // Draw all cells
  function drawCells() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);

    for (const cell of cells) {
      if (!cell.alive) continue;

      // Calculate brightness based on normal.z (facing camera)
      // normal.z near 1 means facing camera, near -1 means back face
      const brightness = Math.max(0.2, cell.normal.z);

      // Cell color with brightness applied
      const baseColor = cellColor(cell.row, cell.col);
      // Parse HSL and adjust lightness by brightness
      // We'll extract H, S, L from baseColor string "hsl(h,s%,l%)"
      const hslMatch = baseColor.match(/hsl\((\d+),\s*(\d+)%,\s*(\d+)%\)/);
      let h = 0, s = 0, l = 0;
      if (hslMatch) {
        h = +hslMatch[1];
        s = +hslMatch[2];
        l = +hslMatch[3];
      }
      // Adjust lightness by brightness factor (linear interpolation)
      const lightness = Math.min(100, Math.max(0, l * brightness));

      const color = `hsl(${h},${s}%,${lightness}%)`;

      // Cell size scaled by perspective and latitude distortion
      // Latitude distortion: cells near poles appear smaller vertically
      // We'll scale cell height by cos(latitude)
      const lat = ((cell.row + 0.5) / GRID_ROWS) * Math.PI - Math.PI / 2;
      const latScale = Math.cos(lat);
      const sizeX = CELL_SIZE * cell.scale;
      const sizeY = CELL_SIZE * cell.scale * latScale;

      // Draw cell as filled rectangle centered at (x2d, y2d)
      ctx.fillStyle = color;
      ctx.fillRect(
        cell.x2d - sizeX / 2,
        cell.y2d - sizeY / 2,
        sizeX,
        sizeY
      );
    }
    ctx.restore();
  }

  // Animation loop
  let lastStepTime = 0;
  function animate(time = 0) {
    // Rotate sphere by velocity
    rotationY += velocityX;
    rotationX += velocityY;

    // Clamp rotationX to avoid flipping upside down
    const maxRotX = Math.PI / 2 - 0.01;
    if (rotationX > maxRotX) rotationX = maxRotX;
    if (rotationX < -maxRotX) rotationX = -maxRotX;

    // Friction on velocity
    velocityX *= 0.95;
    velocityY *= 0.95;

    // Step game at fixed FPS
    if (time - lastStepTime > 1000 / FPS) {
      stepGame();
      lastStepTime = time;
    }

    prepareCells();
    drawCells();

    requestAnimationFrame(animate);
  }

  // Mouse and touch controls for rotation
  function onPointerDown(e) {
    isDragging = true;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    velocityX = 0;
    velocityY = 0;
    canvas.style.cursor = 'grabbing';
  }
  function onPointerMove(e) {
    if (!isDragging) return;
    const dx = e.clientX - lastMouseX;
    const dy = e.clientY - lastMouseY;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;

    // Sensitivity factor
    const sensitivity = 0.005;
    rotationY += dx * sensitivity;
    rotationX += dy * sensitivity;

    // Clamp rotationX
    const maxRotX = Math.PI / 2 - 0.01;
    if (rotationX > maxRotX) rotationX = maxRotX;
    if (rotationX < -maxRotX) rotationX = -maxRotX;

    // Update velocity for inertia
    velocityX = dx * sensitivity;
    velocityY = dy * sensitivity;
  }
  function onPointerUp(e) {
    isDragging = false;
    canvas.style.cursor = 'grab';
  }

  // Resize handler
  function onResize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  // Initialize
  function init() {
    initGrids();
    randomizeGrid(0.15);
    canvas.style.cursor = 'grab';

    window.addEventListener('resize', onResize);
    onResize();

    canvas.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);
    window.addEventListener('pointerleave', onPointerUp);

    requestAnimationFrame(animate);
  }

  init();
})();
</script>
</body>
</html>
